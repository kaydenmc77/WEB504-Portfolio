<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Kayden McManaway's Portfolio Website Contact Page for Front End Developer Job Recruiters"
    />
    <meta name="author" content="Kayden McManaway" />

    <link rel="stylesheet" href="../assets/global-styles/main.css" />
    <link rel="stylesheet" href="../components/header/header.css" />
    <link rel="stylesheet" href="../components/contact/contact.css" />
    <link rel="stylesheet" href="../components/footer/footer.css" />

    <title>Contact</title>
    <script type="module">
      import { loadHeader } from "../utils/headerLoader.js";
      loadHeader("header-container");
    </script>
  </head>

  <div id="header-container"></div>

  <main>
    <div class="contact-container">
      <div class="content-box">
        <h1>Contact Me</h1>

        <form action="error.html">
          <input type="text" placeholder="Name" />
          <input type="email" placeholder="Email Address" />
          <input type="number" placeholder="Phone Number" />
          <textarea placeholder="Message"></textarea>
          <input type="submit" value="Submit" />
        </form>
      </div>
    </div>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <script src="../index.js"></script>
  </main>
